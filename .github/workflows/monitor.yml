name: Jharkhand University Notice Monitor

on:
  workflow_dispatch:
  schedule:
    # Har 2 ghante mein run hoga (0 minute par)
    - cron: '0 */2 * * *'

permissions:
  contents: write

# Serialize all runs that read/write state.json. Do not cancel a run mid-send.
concurrency:
  group: university-notice-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Tesseract OCR (Hindi + English)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-hin tesseract-ocr-eng
          tesseract --version
          tesseract --list-langs

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run self-tests
        run: python monitor.py --test

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          JS_RENDER_ENABLED: 'true'
          TESSERACT_ENABLED: 'true'
          TESSERACT_LANG: 'hin+eng'
        run: python monitor.py

      # Persist state even when monitoring fails after changing state.json.
      - name: Commit and push state.json
        if: always()
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != refs/heads/* ]]; then
            echo "Refusing to push state from a non-branch ref: $GITHUB_REF" >&2
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Stage state.json whether it is tracked or newly created.
          if [[ ! -f state.json ]]; then
            echo "ERROR: state.json does not exist; refusing to claim state persistence." >&2
            exit 1
          fi

          git add -- state.json

          if ! git diff --cached --quiet; then
            git commit -m 'Update university monitor state [skip ci]'
          else
            echo 'state.json has no staged changes.'
          fi

          pushed=false
          for attempt in 1 2 3 4 5; do
            echo "State push attempt ${attempt}/5"
            git fetch origin "$TARGET_BRANCH"

            # Rebase the local state commit (if any) onto the latest branch.
            if ! git rebase "origin/$TARGET_BRANCH"; then
              git rebase --abort || true
              echo "ERROR: Rebase conflict; state was not pushed." >&2
              exit 1
            fi

            if git push origin "HEAD:refs/heads/$TARGET_BRANCH"; then
              pushed=true
              break
            fi

            if [[ "$attempt" -lt 5 ]]; then
              sleep 5
            fi
          done

          if [[ "$pushed" != true ]]; then
            echo 'ERROR: state.json was not persisted to the repository after 5 attempts.' >&2
            exit 1
          fi
