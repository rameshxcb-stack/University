name: Jharkhand University Notice Monitor

on:
  workflow_dispatch:

permissions:
  contents: write

# Serialize all runs that read/write state.json. Do not cancel a run mid-send.
concurrency:
  group: university-notice-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    # ── Buffer: script MAX_RUN_SECONDS=6600 (110m) + 10m for state save ──
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Tesseract OCR (Hindi + English)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-hin tesseract-ocr-eng
          tesseract --version
          tesseract --list-langs

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run self-tests
        run: python monitor.py --test

      # ══════════════════════════════════════════════════════════════════
      # Runtime patch: max_pending_attempts floor 500 → 8
      # Purpose: allow websites.json max_pending_attempts=8 to actually be
      #          enforced (monitor.py has a hard-coded max(500, value) floor).
      # This modifies monitor.py ONLY in the GitHub runner's workspace.
      # The file in the repository is NOT changed — each run re-patches.
      # ══════════════════════════════════════════════════════════════════
      - name: Patch monitor.py (max_pending_attempts 500 -> 8)
        run: |
          python - <<'PYEOF'
          from pathlib import Path
          import sys, ast

          path = Path("monitor.py")
          if not path.exists():
              print("ERROR: monitor.py not found", file=sys.stderr)
              sys.exit(1)

          content = path.read_text(encoding="utf-8")
          old = 'scan["max_pending_attempts"] = max(500, int(scan["max_pending_attempts"]))'
          new = 'scan["max_pending_attempts"] = max(8, int(scan["max_pending_attempts"]))'

          if new in content:
              print("[PATCH] Already patched — max(8, ...) present. Skipping.")
              sys.exit(0)

          if old not in content:
              print("ERROR: Expected line not found in monitor.py:", file=sys.stderr)
              print("  Looking for:", old, file=sys.stderr)
              for i, line in enumerate(content.splitlines(), 1):
                  if "max_pending_attempts" in line:
                      print(f"  Line {i}: {line}", file=sys.stderr)
              sys.exit(1)

          patched = content.replace(old, new, 1)
          path.write_text(patched, encoding="utf-8")
          ast.parse(path.read_text(encoding="utf-8"))
          print("[PATCH] Successfully replaced 500 -> 8 in monitor.py")
          print(f"[PATCH] Old line: {old}")
          print(f"[PATCH] New line: {new}")
          PYEOF

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}

          # ── Layer 4 & 5 fallbacks (optional — blank se skip ho jayega) ──
          CF_WORKER_URL: ${{ secrets.CF_WORKER_URL }}
          SCRAPINGANT_API_KEY: ${{ secrets.SCRAPINGANT_API_KEY }}

          # ── JUT SSL bypass (websites.json mein verify_ssl:false hai; ye env isse honor karwati hai) ──
          ALLOW_INSECURE_TLS: 'true'

          # ── Feature flags ──
          JS_RENDER_ENABLED: 'true'
          TESSERACT_ENABLED: 'true'
          TESSERACT_LANG: 'hin+eng'

          # ── Time budget: 110 min work + 15 min send reserve ──
          MAX_RUN_SECONDS: '6600'
          SEND_RESERVE_SECONDS: '900'
        run: python monitor.py

      # Always try to persist the latest state, even if scanning or notification
      # processing failed after state.json was changed. A failed push fails this job.
      - name: Commit and push state.json
        if: always()
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/heads/* ]]; then
            echo "Refusing to push state from a non-branch ref: $GITHUB_REF" >&2
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add -- state.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update university monitor state [skip ci]'
          else
            echo 'state.json has no staged changes.'
          fi

          pushed=false
          for attempt in 1 2 3 4 5; do
            echo "State push attempt ${attempt}/5"
            git fetch origin "$TARGET_BRANCH"

            # ══════════════════════════════════════════════════════════════
            # IMPORTANT: Discard the runtime patch to monitor.py before rebase.
            # The patch is applied fresh every run, so discarding it here is
            # safe and keeps the working tree clean for git rebase.
            # ══════════════════════════════════════════════════════════════
            git reset --hard HEAD

            if ! git rebase "origin/$TARGET_BRANCH"; then
              git rebase --abort || true
              if [[ "$attempt" -eq 5 ]]; then
                echo 'Could not rebase state commit after 5 attempts.' >&2
                exit 1
              fi
              sleep 5
              continue
            fi

            if git push origin "HEAD:refs/heads/$TARGET_BRANCH"; then
              pushed=true
              break
            fi
            if [[ "$attempt" -lt 5 ]]; then sleep 5; fi
          done

          if [[ "$pushed" != true ]]; then
            echo 'ERROR: state.json was not persisted to the repository.' >&2
            exit 1
          fi
