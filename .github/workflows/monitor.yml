name: Jharkhand University Notice Monitor

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: university-notice-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Tesseract OCR + Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr tesseract-ocr-hin tesseract-ocr-eng \
            xvfb xauth x11-utils
          tesseract --version
          tesseract --list-langs

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium (L3)
        run: python -m playwright install --with-deps chromium

      - name: Install Patchright Chromium (L3.5)
        run: |
          pip install "patchright<2,>=1.40"
          python -m patchright install --with-deps chromium

      - name: Install Camoufox Firefox (L4)
        run: |
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-0t64 libdbus-glib-1-2t64 libxt6t64 \
            libx11-xcb1 libxcb-shm0 libxcb-util1 libasound2t64 \
            xvfb xauth || true
          pip install "camoufox<1"
          python -m camoufox fetch

      - name: Verify new browser layers
        run: |
          xvfb-run --auto-servernum python - <<'PYEOF'
          import sys
          try:
              from patchright.sync_api import sync_playwright
              with sync_playwright() as p:
                  b = p.chromium.launch(headless=False, args=["--no-sandbox","--disable-dev-shm-usage"])
                  pg = b.new_page()
                  pg.goto("about:blank")
                  b.close()
              print("[VERIFY] Patchright Chromium OK (headless=False via xvfb)")
          except Exception as e:
              print(f"[VERIFY] Patchright FAILED: {type(e).__name__}: {e}", file=sys.stderr)
              sys.exit(1)
          PYEOF
          python - <<'PYEOF'
          import sys
          try:
              from camoufox.sync_api import Camoufox
              with Camoufox(headless=True) as b:
                  pg = b.new_page()
                  pg.goto("about:blank")
              print("[VERIFY] Camoufox Firefox OK (headless=True)")
          except Exception as e:
              print(f"[VERIFY] Camoufox FAILED: {type(e).__name__}: {e}", file=sys.stderr)
              sys.exit(1)
          PYEOF

      - name: Run self-tests
        run: python monitor.py --test

      - name: Patch websites.json (batch=5, calls=20)
        run: |
          python - <<'PYEOF'
          from pathlib import Path
          import json, sys
          path = Path("websites.json")
          if not path.exists():
              print("ERROR: websites.json not found", file=sys.stderr)
              sys.exit(1)
          data = json.loads(path.read_text(encoding="utf-8"))
          scan = data.setdefault("scan", {})
          old_batch = scan.get("gemini_batch_size", 3)
          old_calls = scan.get("gemini_max_calls_per_run", 15)
          if old_batch == 5 and old_calls == 20:
              print("[PATCH] websites.json already at 5/20. Skipping.")
              sys.exit(0)
          scan["gemini_batch_size"] = 5
          scan["gemini_max_calls_per_run"] = 20
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(f"[PATCH] gemini_batch_size: {old_batch} -> 5")
          print(f"[PATCH] gemini_max_calls_per_run: {old_calls} -> 20")
          PYEOF

      - name: Patch monitor.py (max_pending_attempts 500 -> 8)
        run: |
          python - <<'PYEOF'
          from pathlib import Path
          import sys, ast
          path = Path("monitor.py")
          if not path.exists():
              print("ERROR: monitor.py not found", file=sys.stderr)
              sys.exit(1)
          content = path.read_text(encoding="utf-8")
          old = 'scan["max_pending_attempts"] = max(500, int(scan["max_pending_attempts"]))'
          new = 'scan["max_pending_attempts"] = max(8, int(scan["max_pending_attempts"]))'
          if new in content:
              print("[PATCH] Already patched — max(8, ...) present. Skipping.")
              sys.exit(0)
          if old not in content:
              print("ERROR: Expected line not found in monitor.py:", file=sys.stderr)
              for i, line in enumerate(content.splitlines(), 1):
                  if "max_pending_attempts" in line:
                      print(f"  Line {i}: {line}", file=sys.stderr)
              sys.exit(1)
          patched = content.replace(old, new, 1)
          path.write_text(patched, encoding="utf-8")
          ast.parse(path.read_text(encoding="utf-8"))
          print("[PATCH] Successfully replaced 500 -> 8 in monitor.py")
          PYEOF

      - name: Patch monitor.py (per-run hard cap 60 -> 150)
        run: |
          python - <<'PYEOF'
          from pathlib import Path
          import sys, ast
          path = Path("monitor.py")
          if not path.exists():
              print("ERROR: monitor.py not found", file=sys.stderr)
              sys.exit(1)
          content = path.read_text(encoding="utf-8")
          old = 'max_items_this_run = min(scan["gemini_batch_size"] * scan["gemini_max_calls_per_run"], 60)'
          new = 'max_items_this_run = min(scan["gemini_batch_size"] * scan["gemini_max_calls_per_run"], 150)'
          if new in content:
              print("[PATCH] Already patched — hard cap 150 present. Skipping.")
              sys.exit(0)
          if old not in content:
              print("ERROR: Expected line not found in monitor.py:", file=sys.stderr)
              for i, line in enumerate(content.splitlines(), 1):
                  if "max_items_this_run" in line:
                      print(f"  Line {i}: {line}", file=sys.stderr)
              sys.exit(1)
          patched = content.replace(old, new, 1)
          path.write_text(patched, encoding="utf-8")
          ast.parse(path.read_text(encoding="utf-8"))
          print("[PATCH] Successfully replaced 60 -> 150 in monitor.py")
          PYEOF

      - name: Patch monitor.py (starvation rescue 5 -> 20)
        run: |
          python - <<'PYEOF'
          from pathlib import Path
          import sys, ast
          path = Path("monitor.py")
          if not path.exists():
              print("ERROR: monitor.py not found", file=sys.stderr)
              sys.exit(1)
          content = path.read_text(encoding="utf-8")
          old = '_starved_reserved = _starved[:5]'
          new = '_starved_reserved = _starved[:20]'
          if new in content:
              print("[PATCH] Already patched — starved rescue 20 present. Skipping.")
              sys.exit(0)
          if old not in content:
              print("ERROR: Expected starvation line not found in monitor.py:", file=sys.stderr)
              for i, line in enumerate(content.splitlines(), 1):
                  if "_starved_reserved" in line:
                      print(f"  Line {i}: {line}", file=sys.stderr)
              sys.exit(1)
          patched = content.replace(old, new, 1)
          path.write_text(patched, encoding="utf-8")
          ast.parse(path.read_text(encoding="utf-8"))
          print("[PATCH] Successfully replaced starved rescue 5 -> 20 in monitor.py")
          PYEOF

      - name: Create stealth wrapper (fixed block detector)
        run: |
          cat > /tmp/stealth_runner.py <<'PYEOF'
          """Runtime wrapper for monitor.py adding L3.5 (Patchright) and L4 (Camoufox).

          Patches monitor._render_with_playwright (a SYNC function returning
          (html, final_url, method)). No source-file changes to monitor.py.

          FIX (2026-11-05): Previous version treated any page containing keywords
          like "please wait", "captcha", "cloudflare" as blocked — even 1.6M-char
          real content pages. This caused every site to launch L3.5 + L4 pointlessly
          (runtime 49 -> 96 min). New detector:
            - fast-path: method is "ok" AND page > 10KB -> NOT blocked
            - only inspect <title> tags + specific CF/Imperva fingerprints
            - only for pages < 50KB
          """
          import os
          import sys

          sys.path.insert(0, os.getcwd())

          try:
              import monitor
          except SystemExit as exc:
              import subprocess
              print(f"[STEALTH] monitor.py exits on import ({exc.code}); running directly", file=sys.stderr)
              sys.exit(subprocess.call([sys.executable, "monitor.py"] + sys.argv[1:]))

          if not hasattr(monitor, "_render_with_playwright"):
              print("[STEALTH] WARNING: _render_with_playwright not found. Running vanilla monitor.py.", file=sys.stderr)
              sys.exit(monitor.main() or 0)

          _orig_render = monitor._render_with_playwright
          print(f"[STEALTH] Found _render_with_playwright: {_orig_render.__name__}", file=sys.stderr)

          _PARAM_ORDER = [
              "timeout_ms", "wait_until", "wait_for_selector", "wait_after_ms",
              "scroll_bottom", "selector_timeout_ms", "ignore_https_errors", "use_stealth",
          ]

          _BLOCK_TITLE_SIGNALS = (
              "<title>attention required",
              "<title>just a moment",
              "<title>access denied",
              "<title>checking your browser",
              "<title>please wait",
              "<title>one more step",
              "<title>security check",
              "<title>ddos-guard",
              "<title>ddos protection by",
              "<title>bot verification",
          )
          _BLOCK_FINGERPRINTS = (
              "cf-browser-verification",
              "cf_chl_opt",
              "challenge-platform/h/b",
              "window._cf_chl_opt",
              "_incapsula_resource",
              "sucuri_cloudproxy_js",
              "ddos-guard",
          )
          _BLOCK_PAGE_MAX_BYTES = 50_000

          def _looks_blocked(html):
              if not html:
                  return True
              if len(html) > _BLOCK_PAGE_MAX_BYTES:
                  return False
              head = html[:3000].lower()
              if any(sig in head for sig in _BLOCK_TITLE_SIGNALS):
                  return True
              lower = html.lower()
              if any(fp in lower for fp in _BLOCK_FINGERPRINTS):
                  return True
              return False

          def _should_retry_stealth(html, method):
              if not html or len(html) < 500:
                  return True
              m = (method or "").lower()
              if "error" in m or "fail" in m:
                  return True
              if "ok" in m and len(html) > 10_000:
                  return False
              return _looks_blocked(html)

          def _bump_counter():
              try:
                  with monitor._JS_RENDER_COUNT_LOCK:
                      monitor._JS_RENDER_COUNT += 1
              except Exception:
                  pass

          def _patchright_render(url, **kw):
              try:
                  from patchright.sync_api import sync_playwright
              except ImportError:
                  return None, url, "patchright_not_installed"
              try:
                  timeout_ms = int(kw.get("timeout_ms") or monitor.JS_RENDER_TIMEOUT_MS)
              except (TypeError, ValueError):
                  timeout_ms = monitor.JS_RENDER_TIMEOUT_MS
              wait_after_ms = kw.get("wait_after_ms")
              try:
                  wait_after_ms = int(wait_after_ms if wait_after_ms is not None else monitor.JS_WAIT_AFTER_MS)
              except (TypeError, ValueError):
                  wait_after_ms = monitor.JS_WAIT_AFTER_MS
              wait_for_selector = kw.get("wait_for_selector")
              try:
                  selector_timeout_ms = int(kw.get("selector_timeout_ms") or 10000)
              except (TypeError, ValueError):
                  selector_timeout_ms = 10000
              scroll_bottom = bool(kw.get("scroll_bottom", False))
              ignore_https_errors = bool(kw.get("ignore_https_errors", False))
              try:
                  with sync_playwright() as pw:
                      browser = pw.chromium.launch(
                          headless=False,
                          args=["--no-sandbox", "--disable-dev-shm-usage",
                                "--disable-gpu", "--disable-blink-features=AutomationControlled"],
                      )
                      try:
                          ctx = browser.new_context(
                              user_agent=monitor.JS_RENDER_USER_AGENT,
                              locale="en-IN",
                              viewport={"width": 1366, "height": 900},
                              java_script_enabled=True,
                              ignore_https_errors=ignore_https_errors,
                              extra_http_headers={"Accept-Language": "en-IN,en;q=0.9,hi;q=0.8"},
                          )
                          page = ctx.new_page()
                          try:
                              page.add_init_script(
                                  "Object.defineProperty(navigator, 'webdriver', {get: () => undefined});"
                                  "Object.defineProperty(navigator, 'plugins', {get: () => [1,2,3,4,5]});"
                                  "Object.defineProperty(navigator, 'languages', {get: () => ['en-IN','en','hi']});"
                                  "window.chrome = { runtime: {} };"
                              )
                          except Exception:
                              pass
                          page.set_default_timeout(timeout_ms)
                          try:
                              page.goto(url, wait_until="domcontentloaded", timeout=timeout_ms)
                          except Exception as exc:
                              return None, url, f"patchright_nav_error:{type(exc).__name__}"
                          try:
                              page.wait_for_load_state("networkidle", timeout=min(8000, timeout_ms))
                          except Exception:
                              pass
                          if wait_for_selector:
                              try:
                                  page.wait_for_selector(wait_for_selector, state="attached",
                                                         timeout=min(selector_timeout_ms, timeout_ms))
                              except Exception:
                                  pass
                          if wait_after_ms:
                              try:
                                  page.wait_for_timeout(wait_after_ms)
                              except Exception:
                                  pass
                          if scroll_bottom:
                              try:
                                  prev = -1
                                  for _ in range(4):
                                      h = page.evaluate("() => Math.max(document.body.scrollHeight, document.documentElement.scrollHeight)")
                                      page.evaluate("() => window.scrollTo(0, document.body.scrollHeight)")
                                      page.wait_for_timeout(600)
                                      if h == prev:
                                          break
                                      prev = h
                              except Exception:
                                  pass
                          try:
                              html = page.content()
                              final_url = page.url or url
                          except Exception as exc:
                              return None, url, f"patchright_content_error:{type(exc).__name__}"
                          if html:
                              _bump_counter()
                          return html, final_url, "patchright_ok"
                      finally:
                          try:
                              browser.close()
                          except Exception:
                              pass
              except Exception as exc:
                  return None, url, f"patchright_error:{type(exc).__name__}"

          def _camoufox_render(url, **kw):
              try:
                  from camoufox.sync_api import Camoufox
              except ImportError:
                  return None, url, "camoufox_not_installed"
              try:
                  timeout_ms = int(kw.get("timeout_ms") or monitor.JS_RENDER_TIMEOUT_MS)
              except (TypeError, ValueError):
                  timeout_ms = monitor.JS_RENDER_TIMEOUT_MS
              wait_after_ms = kw.get("wait_after_ms")
              try:
                  wait_after_ms = int(wait_after_ms if wait_after_ms is not None else monitor.JS_WAIT_AFTER_MS)
              except (TypeError, ValueError):
                  wait_after_ms = monitor.JS_WAIT_AFTER_MS
              ignore_https_errors = bool(kw.get("ignore_https_errors", False))
              def _attempt(**camoufox_kwargs):
                  with Camoufox(**camoufox_kwargs) as browser:
                      page = browser.new_page()
                      page.set_default_timeout(timeout_ms)
                      try:
                          page.goto(url, wait_until="domcontentloaded", timeout=timeout_ms)
                      except Exception as exc:
                          return None, url, f"camoufox_nav_error:{type(exc).__name__}"
                      try:
                          page.wait_for_load_state("networkidle", timeout=min(8000, timeout_ms))
                      except Exception:
                          pass
                      if wait_after_ms:
                          try:
                              page.wait_for_timeout(wait_after_ms)
                          except Exception:
                              pass
                      try:
                          html = page.content()
                          final_url = page.url or url
                      except Exception as exc:
                          return None, url, f"camoufox_content_error:{type(exc).__name__}"
                      if html:
                          _bump_counter()
                      return html, final_url, "camoufox_ok"
              try:
                  return _attempt(headless=True, ignore_https_errors=ignore_https_errors)
              except TypeError:
                  try:
                      return _attempt(headless=True)
                  except Exception as exc:
                      return None, url, f"camoufox_error:{type(exc).__name__}"
              except Exception as exc:
                  return None, url, f"camoufox_error:{type(exc).__name__}"

          def _patched_render(url, *args, **kwargs):
              for i, val in enumerate(args):
                  if i < len(_PARAM_ORDER):
                      kwargs.setdefault(_PARAM_ORDER[i], val)
              try:
                  html, final_url, method = _orig_render(url, **kwargs)
              except Exception as exc:
                  html, final_url, method = None, url, f"orig_error:{type(exc).__name__}"
              if not _should_retry_stealth(html, method):
                  return html, final_url, method
              print(f"[SCAN-L3.5] Trying Patchright: {url[:80]}", file=sys.stderr)
              pr_html, pr_url, pr_method = _patchright_render(url, **kwargs)
              if not _should_retry_stealth(pr_html, pr_method):
                  print(f"[SCAN-L3.5] OK: {url[:80]}", file=sys.stderr)
                  return pr_html, pr_url, pr_method
              print(f"[SCAN-L3.5-FAIL] {pr_method}: {url[:80]}", file=sys.stderr)
              print(f"[SCAN-L4] Trying Camoufox: {url[:80]}", file=sys.stderr)
              cf_html, cf_url, cf_method = _camoufox_render(url, **kwargs)
              if not _should_retry_stealth(cf_html, cf_method):
                  print(f"[SCAN-L4] OK: {url[:80]}", file=sys.stderr)
                  return cf_html, cf_url, cf_method
              print(f"[SCAN-L4-FAIL] {cf_method}: {url[:80]}", file=sys.stderr)
              if html:
                  return html, final_url, method
              if pr_html:
                  return pr_html, pr_url, pr_method
              if cf_html:
                  return cf_html, cf_url, cf_method
              return None, url, "all_stealth_layers_failed"

          monitor._render_with_playwright = _patched_render
          print("[STEALTH] Patched _render_with_playwright — L3.5 + L4 active (FIXED block detector)", file=sys.stderr)

          sys.exit(monitor.main() or 0)
          PYEOF
          echo "[STEALTH] /tmp/stealth_runner.py created"

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          CF_WORKER_URL: ${{ secrets.CF_WORKER_URL }}
          SCRAPINGANT_API_KEY: ${{ secrets.SCRAPINGANT_API_KEY }}
          ALLOW_INSECURE_TLS: 'true'
          JS_RENDER_ENABLED: 'true'
          TESSERACT_ENABLED: 'true'
          TESSERACT_LANG: 'hin+eng'
          MAX_RUN_SECONDS: '6600'
          SEND_RESERVE_SECONDS: '900'
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            python /tmp/stealth_runner.py

      # ══════════════════════════════════════════════════════════════════
      # POST-RUN CLEANUP — fixes 2 known bugs in state.json.
      #
      # BUG 1: Site-chrome images (examination.png, university.png,
      #        student.png, media-coverage.png, etc.) were being treated
      #        as notices. They consume 3 OCR retries each, then sit in
      #        pending forever. Dead-letter them.
      #
      # BUG 2: Stale never-attempted items (attempts=0, >14 days old,
      #        with a 2010-2023 year in title/URL) never get a processing
      #        slot because fresh items always take priority. Abandon them
      #        so they stop blocking the queue.
      #
      # Idempotent — safe to run every time. Does NOT touch monitor.py.
      # ══════════════════════════════════════════════════════════════════
      - name: Post-run cleanup (fix 2 bugs)
        if: always()
        run: |
          python - <<'PYEOF'
          from pathlib import Path
          from datetime import datetime, timezone
          import json, sys, re

          path = Path("state.json")
          if not path.exists():
              print("[CLEANUP] No state.json — skipping")
              sys.exit(0)

          try:
              state = json.loads(path.read_text(encoding="utf-8"))
          except Exception as exc:
              print(f"[CLEANUP] state.json unreadable ({exc}); skipping", file=sys.stderr)
              sys.exit(0)

          items = state.get("items", {}) or {}
          now = datetime.now(timezone.utc)

          # ── BUG 1 FIX: site-chrome images treated as notices ──
          CHROME_BARE = {
              "logo", "icon", "banner", "favicon", "header", "footer",
              "examination", "examinations", "university", "student", "students",
              "notices", "alumni", "fac2", "media-coverage", "gallery",
              "epointer", "controller", "studentreg", "admission", "syllabus",
          }
          IMG_EXTS = (".png", ".svg", ".ico", ".gif", ".webp", ".jpg", ".jpeg")
          bug1_count = 0
          for iid, item in items.items():
              if not isinstance(item, dict):
                  continue
              if item.get("status") not in ("pending", "permanent_error"):
                  continue
              url = (item.get("url") or "").lower().split("?")[0]
              if not url.endswith(IMG_EXTS):
                  continue
              fname = url.rsplit("/", 1)[-1].rsplit(".", 1)[0]
              if fname in CHROME_BARE:
                  item["status"] = "dead_letter"
                  item["last_error"] = f"site_chrome_image:{fname}"
                  bug1_count += 1
          print(f"[CLEANUP-BUG1] Dead-lettered {bug1_count} site-chrome image(s)")

          # ── BUG 2 FIX: stale never-attempted items blocking queue ──
          OLD_YEAR_RE = re.compile(r"\b(20(1\d|2[0-3]))\b")  # 2010–2023
          bug2_count = 0
          for iid, item in items.items():
              if not isinstance(item, dict):
                  continue
              if item.get("status") != "pending":
                  continue
              if int(item.get("attempts", 0) or 0) != 0:
                  continue
              fs = item.get("first_seen")
              if not fs:
                  continue
              try:
                  age_days = (now - datetime.fromisoformat(fs.replace("Z", "+00:00"))).days
              except Exception:
                  continue
              if age_days <= 14:
                  continue
              blob = f"{item.get('title', '')} {item.get('url', '')}"
              if OLD_YEAR_RE.search(blob):
                  item["status"] = "abandoned"
                  item["last_error"] = f"stale_and_never_attempted:{age_days}d"
                  bug2_count += 1
          print(f"[CLEANUP-BUG2] Abandoned {bug2_count} stale never-attempted item(s)")

          path.write_text(
              json.dumps(state, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          pending = sum(1 for r in items.values()
                        if isinstance(r, dict) and r.get("status") == "pending")
          print(f"[CLEANUP] Done. pending_now={pending}")
          PYEOF

      # ══════════════════════════════════════════════════════════════════
      # SAFETY-NET LAYER — the "no miss" guarantee.
      # ══════════════════════════════════════════════════════════════════
      - name: Safety-net delivery (raw alerts for stuck items)
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PYEOF'
          import json, os, sys, requests
          from pathlib import Path
          from datetime import datetime, timezone

          state_path = Path("state.json")
          if not state_path.exists():
              print("[SAFETY-NET] No state.json — skipping")
              sys.exit(0)

          state = json.loads(state_path.read_text(encoding="utf-8"))
          items = state.get("items", {}) or {}
          sites = state.get("sites", {}) or {}

          token = os.getenv("TELEGRAM_BOT_TOKEN", "").strip()
          chat_id = os.getenv("TELEGRAM_CHAT_ID", "").strip()
          if not token or not chat_id:
              print("[SAFETY-NET] No Telegram credentials — skipping", file=sys.stderr)
              sys.exit(0)

          def _send(text):
              try:
                  r = requests.post(
                      f"https://api.telegram.org/bot{token}/sendMessage",
                      json={"chat_id": chat_id, "text": text,
                            "parse_mode": "HTML", "disable_web_page_preview": True},
                      timeout=30,
                  )
                  return r.ok, r.status_code, (r.text[:200] if not r.ok else "")
              except Exception as e:
                  return False, 0, str(e)

          now = datetime.now(timezone.utc).isoformat()
          modified = False
          sent_count = 0
          per_run_cap = 10

          for iid, rec in list(items.items()):
              if sent_count >= per_run_cap:
                  break
              if not isinstance(rec, dict):
                  continue

              status = rec.get("status")
              attempts = int(rec.get("attempts", 0) or 0)
              tel_attempts = int(rec.get("telegram_attempts", 0) or 0)

              at_risk = (
                  tel_attempts == 0 and
                  (
                      status == "permanent_error" or
                      (status == "pending" and attempts >= 5)
                  )
              )
              if not at_risk:
                  continue

              title = (rec.get("title") or "Untitled")[:180]
              url = rec.get("url") or ""
              site_name = rec.get("site_name") or rec.get("site_id") or "Unknown site"
              err = (rec.get("last_error") or "unknown error")[:200]

              text = (
                  f"⚠️ <b>Safety-Net Alert</b>\n\n"
                  f"<b>{site_name}</b>\n"
                  f"{title}\n\n"
                  f"<i>Reason: {err}</i>\n"
                  f"<i>Attempts: {attempts} | Status: {status}</i>\n\n"
                  f'🔗 <a href="{url}">Open original link</a>\n\n'
                  f"<i>Auto-processing failed. Please check manually.</i>"
              )

              ok, code, detail = _send(text)
              if ok:
                  rec["telegram_attempts"] = tel_attempts + 1
                  rec["status"] = "sent"
                  rec["sent_at"] = now
                  rec["last_error"] = f"Safety-net raw delivery: {err}"
                  rec["safety_net_at"] = now
                  sent_count += 1
                  modified = True
                  print(f"[SAFETY-NET] Sent raw alert: {title[:60]}")
              else:
                  print(f"[SAFETY-NET] Failed (HTTP {code}): {detail}", file=sys.stderr)

          persistent_fails = []
          for sid, srec in sites.items():
              if not isinstance(srec, dict):
                  continue
              consec = int(srec.get("consecutive_failures", 0) or 0)
              if consec >= 10:
                  persistent_fails.append((sid, consec, (srec.get("last_error") or "")[:120]))

          if persistent_fails:
              last_alert = state.get("safety_net_last_site_alert_at")
              should_alert = True
              if last_alert:
                  try:
                      from datetime import datetime as _dt
                      last_dt = _dt.fromisoformat(last_alert.replace("Z", "+00:00"))
                      if last_dt.tzinfo is None:
                          last_dt = last_dt.replace(tzinfo=timezone.utc)
                      age_h = (datetime.now(timezone.utc) - last_dt).total_seconds() / 3600
                      if age_h < 24:
                          should_alert = False
                  except Exception:
                      pass

              if should_alert:
                  lines = ["🚨 <b>Persistent Site Failure Alert</b>", "",
                           "These sites have been failing 10+ consecutive runs:",
                           ""]
                  for sid, consec, err in persistent_fails[:10]:
                      lines.append(f"• <b>{sid}</b> — {consec} consecutive fails")
                      if err:
                          lines.append(f"  <i>{err}</i>")
                  lines.append("")
                  lines.append("<i>New notices on these sites are NOT being detected. "
                               "Manual check or config fix required.</i>")
                  ok, code, detail = _send("\n".join(lines))
                  if ok:
                      state["safety_net_last_site_alert_at"] = now
                      modified = True
                      print(f"[SAFETY-NET] Sent persistent failure alert for {len(persistent_fails)} sites")
                  else:
                      print(f"[SAFETY-NET] Site alert failed: HTTP {code} {detail}", file=sys.stderr)

          total_pending = sum(1 for r in items.values()
                              if isinstance(r, dict) and r.get("status") == "pending")
          if total_pending >= 200:
              last_alert = state.get("safety_net_last_backlog_alert_at")
              should_alert = True
              if last_alert:
                  try:
                      from datetime import datetime as _dt
                      last_dt = _dt.fromisoformat(last_alert.replace("Z", "+00:00"))
                      if last_dt.tzinfo is None:
                          last_dt = last_dt.replace(tzinfo=timezone.utc)
                      age_h = (datetime.now(timezone.utc) - last_dt).total_seconds() / 3600
                      if age_h < 24:
                          should_alert = False
                  except Exception:
                      pass

              if should_alert:
                  text = (
                      f"⚠️ <b>Queue Backlog Alert</b>\n\n"
                      f"{total_pending} items are stuck in pending queue.\n\n"
                      f"<i>This means many notices haven't been processed. "
                      f"Check logs for TIME_LIMIT or repeated failures.</i>"
                  )
                  ok, code, detail = _send(text)
                  if ok:
                      state["safety_net_last_backlog_alert_at"] = now
                      modified = True
                      print(f"[SAFETY-NET] Sent backlog alert ({total_pending} pending)")
                  else:
                      print(f"[SAFETY-NET] Backlog alert failed: HTTP {code} {detail}", file=sys.stderr)

          if modified:
              state_path.write_text(
                  json.dumps(state, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8"
              )
              print(f"[SAFETY-NET] state.json updated (sent {sent_count} raw alerts)")
          else:
              print("[SAFETY-NET] No changes needed")
          PYEOF

      - name: Commit and push state.json
        if: always()
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/heads/* ]]; then
            echo "Refusing to push state from a non-branch ref: $GITHUB_REF" >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- state.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update university monitor state [skip ci]'
          else
            echo 'state.json has no staged changes.'
          fi
          pushed=false
          for attempt in 1 2 3 4 5; do
            echo "State push attempt ${attempt}/5"
            git fetch origin "$TARGET_BRANCH"
            git reset --hard HEAD
            if ! git rebase "origin/$TARGET_BRANCH"; then
              git rebase --abort || true
              if [[ "$attempt" -eq 5 ]]; then
                echo 'Could not rebase state commit after 5 attempts.' >&2
                exit 1
              fi
              sleep 5
              continue
            fi
            if git push origin "HEAD:refs/heads/$TARGET_BRANCH"; then
              pushed=true
              break
            fi
            if [[ "$attempt" -lt 5 ]]; then sleep 5; fi
          done
          if [[ "$pushed" != true ]]; then
            echo 'ERROR: state.json was not persisted to the repository.' >&2
            exit 1
          fi
