name: Jharkhand University Notification Monitor

on:
  schedule:
    - cron: '0 */6 * * *'      # Every 6 hours (adjust as needed)
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 120        # ← SAFETY NET: kill job after 2 hours

    steps:
      - uses: actions/checkout@v4

      # ---------- CACHE: pip (huge speedup for PaddleOCR) ----------
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # ---------- CACHE: Playwright browsers ----------
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      # ---------- CACHE: PaddleOCR model weights ----------
      - name: Cache PaddleOCR models
        uses: actions/cache@v4
        with:
          path: ~/.paddleocr
          key: ${{ runner.os }}-paddleocr-models-v1
          restore-keys: |
            ${{ runner.os }}-paddleocr-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install chromium --with-deps

      - name: Install Tesseract Hindi
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-hin

      - name: Verify OCR engines
        run: |
          python -c "
          import sys
          try:
              from paddleocr import PaddleOCR
              print('[OK] PaddleOCR available')
          except ImportError as e:
              print(f'[FAIL] PaddleOCR missing: {e}'); sys.exit(1)
          import pytesseract
          print('[OK] Tesseract available')
          try:
              from rapidocr_onnxruntime import RapidOCR
              print('[OK] RapidOCR available')
          except ImportError:
              print('[WARN] RapidOCR missing (non-fatal)')
          "

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          OCR_DPI: "250"
          OCR_ENABLED: "true"
          PADDLEOCR_ENABLED: "true"
          TESSERACT_ENABLED: "true"
          MAX_RUN_SECONDS: "5400"        # 90 min
          SEND_RESERVE_SECONDS: "900"    # reserve 15 min for sending
        run: python monitor.py

      - name: Upload state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitor-state
          path: state.json
          retention-days: 7
