name: Jharkhand University Notification Monitor

on:
  workflow_dispatch: # External Cron isse trigger karega

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 90        # Safety net (agar run atak jaye toh 90 min mein kill)

    steps:
      - uses: actions/checkout@v4

      # ---------- CACHE: pip ----------
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # ---------- CACHE: Playwright browsers ----------
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install chromium --with-deps

      - name: Install Tesseract Hindi
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-hin

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          OCR_DPI: "250"
          OCR_ENABLED: "true"
          PADDLEOCR_ENABLED: "false" # Code mein already disabled hai
          TESSERACT_ENABLED: "true"
          MAX_RUN_SECONDS: "4800"        # 80 minutes max run time
          SEND_RESERVE_SECONDS: "600"    # reserve 10 min for sending
        run: python monitor.py

      - name: Upload state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitor-state
          path: state.json
          retention-days: 7
